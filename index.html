<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111827" />

  <title>Personal Dictionary</title>

  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body class="login-page">

  <main class="card login-card">

    <div class="brand">
  <h1 class="brand-title">Personal Dictionary</h1>

  <div class="brand-flags">
    <img src="./chinese-flag.png" alt="Chinese" />
    <img src="./arabic-flag.png" alt="Arabic" />
    <img src="./turkish-flag.png" alt="Turkish" />
  </div>
</div>

    <form id="loginForm">

      <div class="field">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="field">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="••••••••••••"
        />
      </div>

      <button
        id="loginButton"
        type="submit"
      >
        Sign in
      </button>

      <div
        id="status"
        class="status"
      ></div>

    </form>

  </main>

  <script
    type="module"
    src="./js/auth.js"
  ></script>

</body>
</html>
