<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Turkish Word</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="wiktionary-page editor-page">
  <header class="wiktionary-topbar">
    <button id="backButton" class="wiki-round-button" type="button" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <h1 class="library-topbar-title">Edit word</h1>
    <div class="wiki-language-indicator" aria-label="Turkish">
      <img src="../assets/images/turkish-flag.png" alt="Turkish" />
    </div>
  </header>

  <main class="wiktionary-shell editor-shell">
    <form id="wordEditorForm" class="word-editor-form">
      <section class="editor-card">
        <div class="editor-word-heading">
          <span class="editor-label">Word</span>
          <strong id="wordDisplay"></strong>
        </div>
        <input id="wordInput" type="hidden" />

        <section class="editor-section">
          <h2>Etymology</h2>
          <textarea id="analysisInput" rows="3"
            placeholder="Add etymology"></textarea>
        </section>
        <section class="editor-section">
          <h2>Pronunciation</h2>
          <div id="pronunciationFields" class="editor-items"></div>
          <button class="editor-add-button" type="button"
            data-add-pronunciation>+ Add pronunciation</button>
        </section>
        <section class="editor-section">
          <h2>Forms</h2>
          <div id="formsFields" class="editor-items"></div>
          <button class="editor-add-button" type="button"
            data-add-form>+ Add form</button>
        </section>
        <section class="editor-section">
          <h2>Notes</h2>
          <div id="notesFields" class="editor-items"></div>
          <button class="editor-add-button" type="button"
            data-add-note>+ Add note</button>
        </section>
        <section class="editor-section">
          <h2>Meanings</h2>
          <div id="meaningsFields" class="editor-items"></div>
          <button class="editor-add-button" type="button"
            data-add-meaning>+ Add meaning</button>
        </section>
        <section class="editor-section">
          <h2>Base word</h2>
          <div class="editor-base-row">
            <input id="baseWordInput" placeholder="Search exact word in cache" />
            <button id="baseWordSearchButton" type="button">Search</button>
          </div>
          <div id="baseWordResults" class="editor-base-results"></div>
        </section>
      </section>
      <div class="word-editor-actions">
        <button id="cancelButton" type="button">Cancel</button>
        <button class="wiki-search-button" type="submit">Save changes</button>
      </div>
      <p id="editorStatus" class="wiki-status" hidden></p>
    </form>
  </main>
  <script type="module" src="../assets/js/pages/turkish-edit.js"></script>
</body>
</html>
