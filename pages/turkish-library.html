<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turkish Library</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="wiktionary-page library-page">
  <header class="wiktionary-topbar">
    <button
      id="backButton"
      class="wiki-round-button"
      type="button"
      aria-label="Go back"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M15 18l-6-6 6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1 class="library-topbar-title">Turkish Library</h1>
    <div class="wiki-language-indicator" aria-label="Turkish">
      <img src="../assets/images/turkish-flag.png" alt="Turkish" />
    </div>
  </header>

  <main class="wiktionary-shell">
    <button
      id="previewLibraryButton"
      class="library-preview-button"
      type="button"
    >
      Preview test library
    </button>

    <form
      id="librarySearchForm"
      class="wiktionary-search-form"
    >
      <div class="wiki-search-input-wrap">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15a7.5 7.5 0 0 1 0 15Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="librarySearchInput"
          type="search"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search a saved Turkish word..."
        />
        <button
          id="libraryClearSearchButton"
          class="library-search-clear"
          type="button"
          aria-label="Clear library search"
          title="Show all saved words"
          hidden
        >
          ×
        </button>
      </div>
      <button
        type="submit"
        class="wiki-search-button"
      >
        Search in my library
      </button>
    </form>
    <div
      id="libraryToolbar"
      class="library-toolbar"
    >
      <span id="libraryCount"></span>
      <div>
        <button
          id="filterButton"
          class="library-filter-button"
          type="button"
          aria-label="Change library order"
          aria-expanded="false"
          title="Change order"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 6h16M7 12h10M10 18h4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div
          id="filterMenu"
          class="library-filter-menu"
          hidden
        >
          <button type="button" data-sort="newest">Newest first</button>
          <button type="button" data-sort="oldest">Oldest first</button>
          <button type="button" data-sort="alphabetical">Alphabetical</button>
        </div>
      </div>
    </div>
    <section
      id="libraryEntries"
      class="wiki-entry-list library-entry-list"
    ></section>
  </main>
  <script type="module" src="../assets/js/pages/turkish-library.js"></script>
</body>
</html>
