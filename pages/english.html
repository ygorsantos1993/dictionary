<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#64778a" />

  <title>English</title>

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body class="english-page">

  <header class="english-topbar">

    <button
      id="englishBackButton"
      class="wiki-round-button"
      type="button"
      aria-label="Back to dictionary"
      title="Back"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M15 18l-6-6 6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <div class="language-selector">

      <button
        id="languageButton"
        class="hub-language-button"
        type="button"
        aria-label="Open language menu"
        aria-expanded="false"
      >
        <img
          id="currentLanguageFlag"
          class="hub-language-flag"
          src="../english-flag.png"
          alt="English"
        />

        <svg
          class="language-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6 9l6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>


      <div
        id="languageMenu"
        class="language-menu"
        hidden
      >

        <button
          class="language-option"
          type="button"
          data-language="english"
        >
          <img
            src="../english-flag.png"
            alt=""
          />

          <span>English</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="chinese"
        >
          <img
            src="../chinese-flag.png"
            alt=""
          />

          <span>Chinese</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="msa"
        >
          <img
            src="../arabic-flag.png"
            alt=""
          />

          <span>Standard Arabic</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="turkish"
        >
          <img
            src="../turkish-flag.png"
            alt=""
          />

          <span>Turkish</span>
        </button>


        <div class="language-menu-divider"></div>


        <button
          id="logoutButton"
          class="menu-signout"
          type="button"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M10 17l5-5-5-5M15 12H3M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <span>Sign out</span>
        </button>

      </div>

    </div>

  </header>


  <main class="english-shell">

    <section class="english-title-section">

      <h1>
        ENGLISH
      </h1>

      <div class="english-index-label">
        WORD INDEX
      </div>

      <div
        class="hub-ornament"
        aria-hidden="true"
      >
        <span></span>
        <strong>◇</strong>
        <span></span>
      </div>

    </section>


    <section class="english-search-card">

      <div class="english-search-heading">

        <img
          src="../globe.png"
          alt=""
          class="english-search-icon"
        />

        <div>
          <div class="english-search-eyebrow">
            SEARCH
          </div>

          <h2>
            English word
          </h2>
        </div>

      </div>


      <form
        id="englishSearchForm"
        class="english-search-form"
      >

        <div class="english-search-input-wrap">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />

            <path
              d="M16 16l4 4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="englishSearchInput"
            type="search"
            placeholder="Search an English word"
            autocomplete="off"
            spellcheck="false"
          />

        </div>


        <button
          id="englishSearchButton"
          class="english-search-button"
          type="submit"
        >
          Search
        </button>

      </form>


      <div
        id="englishSearchStatus"
        class="english-search-status"
        hidden
      ></div>

    </section>


    <section
      id="englishResults"
      class="english-results-placeholder"
      hidden
    ></section>

  </main>


  <script
    type="module"
    src="./js/english.js"
  ></script>

</body>
</html>
