<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111827" />

  <title>Dictionary</title>

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body class="dictionary-page">

  <main class="dictionary-container">

    <section class="app-card">

      <header class="app-header">

        <div>
          <h1>Dictionary</h1>

          <div
            id="userEmail"
            class="user-email"
          ></div>
        </div>

        <div class="header-actions">

          <div class="language-selector">

            <button
              id="languageButton"
              class="language-button"
              type="button"
              aria-label="Change dictionary language"
              aria-expanded="false"
            >
              <img
                id="currentLanguageFlag"
                class="current-language-flag"
                src="../chinese-flag.png"
                alt="Chinese"
              />
            </button>

            <div
              id="languageMenu"
              class="language-menu"
              hidden
            >

              <button
                class="language-option"
                type="button"
                data-language="chinese"
              >
                <img
                  src="../chinese-flag.png"
                  alt=""
                />

                <span>Chinese</span>
              </button>

              <button
                class="language-option"
                type="button"
                data-language="arabic"
              >
                <img
                  src="../arabic-flag.png"
                  alt=""
                />

                <span>Arabic</span>
              </button>

              <button
                class="language-option"
                type="button"
                data-language="turkish"
              >
                <img
                  src="../turkish-flag.png"
                  alt=""
                />

                <span>Turkish</span>
              </button>

            </div>

          </div>

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Sign out
          </button>

        </div>

      </header>

      <div class="placeholder">
        Wiktionary search will go here.
      </div>

    </section>

  </main>

  <script
    type="module"
    src="./js/dictionary.js"
  ></script>

</body>
</html>
