<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#64778a" />

  <title>Turkish Dictionary</title>

  <link
    rel="stylesheet"
    href="../assets/css/styles.css"
  />
</head>

<body class="dictionary-page">

  <header class="dictionary-topbar">

    <button
      id="syncButton"
      class="hub-top-button sync-button"
      type="button"
      aria-label="Synchronize dictionaries"
      title="Sync"
    >
      <img
        class="sync-icon"
        src="../assets/images/sync.png"
        alt=""
        aria-hidden="true"
      />
    </button>


    <div class="language-selector">

      <button
        id="languageButton"
        class="hub-language-button"
        type="button"
        aria-label="Open language menu"
        aria-expanded="false"
      >
        <img
          id="currentLanguageFlag"
          class="hub-language-flag"
          src="../assets/images/turkish-flag.png"
          alt="Turkish"
        />

        <svg
          class="language-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6 9l6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>


      <div
        id="languageMenu"
        class="language-menu"
        hidden
      >

        <button
          class="language-option"
          type="button"
          data-language="english"
        >
          <img
            src="../assets/images/english-flag.png"
            alt=""
          />

          <span>English</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="chinese"
        >
          <img
            src="../assets/images/chinese-flag.png"
            alt=""
          />

          <span>Chinese</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="msa"
        >
          <img
            src="../assets/images/arabic-flag.png"
            alt=""
          />

          <span>Standard Arabic</span>
        </button>


        <button
          class="language-option"
          type="button"
          data-language="turkish"
        >
          <img
            src="../assets/images/turkish-flag.png"
            alt=""
          />

          <span>Turkish</span>
        </button>


        <div class="language-menu-divider"></div>


        <button
          id="logoutButton"
          class="menu-signout"
          type="button"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M10 17l5-5-5-5M15 12H3M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <span>Sign out</span>
        </button>

      </div>

    </div>

  </header>


  <main class="dictionary-hub">

    <section class="hub-title-section">

      <h1
        id="hubLanguageTitle"
        class="hub-language-title"
      >
        TURKISH
      </h1>

      <div class="hub-dictionary-label">
        DICTIONARY
      </div>

      <div
        class="hub-ornament"
        aria-hidden="true"
      >
        <span></span>
        <strong>◇</strong>
        <span></span>
      </div>

    </section>


    <section class="hub-menu">

      <button
        id="wiktionaryCard"
        class="hub-card"
        type="button"
      >

        <div class="hub-card-icon-wrap">
          <img
            src="../assets/images/globe.png"
            alt=""
            class="hub-card-icon"
          />
        </div>

        <div class="hub-card-content">

          <div class="hub-card-title">
            Search on Wiktionary
          </div>

          <div
            id="wiktionaryDirection"
            class="hub-card-subtitle"
          >
            Turkish → English
          </div>

        </div>

        <svg
          class="hub-card-arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M9 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>


      <button
        id="dictionarySearchCard"
        class="hub-card"
        type="button"
      >

        <div class="hub-card-icon-wrap">
          <img
            src="../assets/images/dictionary.png"
            alt=""
            class="hub-card-icon"
          />
        </div>

        <div class="hub-card-content">

          <div class="hub-card-title">
            Search in My Dictionary
          </div>

          <div class="hub-card-subtitle">
            Search saved words
          </div>

        </div>

        <svg
          class="hub-card-arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M9 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>


      <button
        id="libraryCard"
        class="hub-card"
        type="button"
      >

        <div class="hub-card-icon-wrap">
          <img
            src="../assets/images/library.png"
            alt=""
            class="hub-card-icon"
          />
        </div>

        <div class="hub-card-content">

          <div class="hub-card-title">
            Open Library
          </div>

          <div class="hub-card-subtitle">
            Browse your collection
          </div>

        </div>

        <svg
          class="hub-card-arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M9 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>


      <button
        id="readingModeCard"
        class="hub-card"
        type="button"
      >

        <div class="hub-card-icon-wrap">
          <img
            src="../assets/images/reading-mode.png"
            alt=""
            class="hub-card-icon"
          />
        </div>

        <div class="hub-card-content">

          <div class="hub-card-title">
            Reading Mode
          </div>

          <div class="hub-card-subtitle">
            Read and explore any text
          </div>

        </div>

        <svg
          class="hub-card-arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M9 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>

    </section>


    <div
      class="hub-bottom-ornament"
      aria-hidden="true"
    >
      <span></span>
      <strong>◇</strong>
      <span></span>
    </div>

  </main>


  <div
    id="syncToast"
    class="sync-toast"
    hidden
  >
    Dictionary synchronized
  </div>


  <script
    type="module"
    src="../assets/js/pages/dictionary.js"
  ></script>

</body>
</html>
