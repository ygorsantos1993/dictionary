<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111827" />

  <title>Dictionary</title>

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body class="dictionary-page">

  <div class="top-menu">

    <button
      id="languageButton"
      class="language-button"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <img
        id="currentLanguageFlag"
        class="current-language-flag"
        src="../chinese-flag.png"
        alt="Chinese"
      />
    </button>

    <div
      id="languageMenu"
      class="language-menu"
      hidden
    >

      <button
        class="language-option"
        type="button"
        data-language="chinese"
      >
        <img
          src="../chinese-flag.png"
          alt=""
        />

        <span>Chinese</span>
      </button>

      <button
        class="language-option"
        type="button"
        data-language="arabic_msa"
      >
        <img
          src="../arabic-flag.png"
          alt=""
        />

        <span>Modern Standard Arabic</span>
      </button>

      <button
        class="language-option"
        type="button"
        data-language="turkish"
      >
        <img
          src="../turkish-flag.png"
          alt=""
        />

        <span>Turkish</span>
      </button>

      <div class="language-menu-divider"></div>

      <button
        id="logoutButton"
        class="menu-signout"
        type="button"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <path
            d="M10 17l5-5-5-5M15 12H3M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>Sign out</span>
      </button>

    </div>

  </div>


  <main class="dictionary-container">

    <section class="app-card">

      <header class="app-header">

        <div>
          <h1>Dictionary</h1>

          <div
            id="userEmail"
            class="user-email"
          ></div>
        </div>

      </header>

      <div class="placeholder">
        Wiktionary search will go here.
      </div>

    </section>

  </main>

  <script
    type="module"
    src="./js/dictionary.js"
  ></script>

</body>
</html>
