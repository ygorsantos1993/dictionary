<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111827" />

  <title>Dictionary</title>

  <link
    rel="stylesheet"
    href="../css/styles.css"
  />
</head>

<body class="dictionary-page">

  <header class="dictionary-topbar">

    <div class="topbar-left">

      <button
        id="syncButton"
        class="sync-button"
        type="button"
        aria-label="Synchronize dictionary"
        title="Sync dictionary"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M20 12a8 8 0 0 1-13.66 5.66M4 12A8 8 0 0 1 17.66 6.34M20 4v6h-6M4 20v-6h6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>Sync</span>
      </button>

    </div>


    <div class="topbar-center">

      <button
        id="libraryButton"
        class="library-button"
        type="button"
        aria-label="Open library"
        title="My Dictionary"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linejoin="round"
          />

          <path
            d="M20 5.5A2.5 2.5 0 0 0 17.5 3H14v18a3 3 0 0 1 3-3h.5a2.5 2.5 0 0 1 2.5 2.5V5.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linejoin="round"
          />
        </svg>
      </button>

    </div>


    <div class="topbar-right">

      <div class="language-selector">

        <button
          id="languageButton"
          class="language-button"
          type="button"
          aria-label="Open dictionary menu"
          aria-expanded="false"
        >
          <img
            id="currentLanguageFlag"
            class="current-language-flag"
            src="../turkish-flag.png"
            alt="Turkish"
          />
        </button>


        <div
          id="languageMenu"
          class="language-menu"
          hidden
        >

          <button
            class="language-option"
            type="button"
            data-language="chinese"
          >
            <img
              src="../chinese-flag.png"
              alt=""
            />

            <span>Chinese</span>
          </button>


          <button
            class="language-option"
            type="button"
            data-language="msa"
          >
            <img
              src="../arabic-flag.png"
              alt=""
            />

            <span>Standard Arabic</span>
          </button>


          <button
            class="language-option"
            type="button"
            data-language="turkish"
          >
            <img
              src="../turkish-flag.png"
              alt=""
            />

            <span>Turkish</span>
          </button>


          <div class="language-menu-divider"></div>


          <button
            id="logoutButton"
            class="menu-signout"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M10 17l5-5-5-5M15 12H3M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span>Sign out</span>
          </button>

        </div>

      </div>

    </div>

  </header>


  <main class="dictionary-container">

    <h1
      id="dictionaryTitle"
      class="dictionary-title"
    >
      Turkish Dictionary
    </h1>


    <!-- SEARCH ONLINE -->

    <section class="search-card">

      <div class="card-title-area">

        <div class="card-heading">

          <span
            class="online-icon"
            aria-hidden="true"
          >
            🌐
          </span>

          <h2>
            Search online
          </h2>

        </div>

        <div
          id="onlineDirection"
          class="search-direction"
        >
          English → Turkish
        </div>

      </div>


      <form
        id="onlineSearchForm"
        class="search-form"
      >

        <div class="search-language-flag">
          <img
            src="../english-flag.png"
            alt="English"
          />
        </div>


        <div class="search-field-wrap">

          <svg
            class="field-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15a7.5 7.5 0 0 1 0 15Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="onlineSearchInput"
            type="text"
            autocomplete="off"
            placeholder="Type a word in English..."
          />

        </div>


        <div class="search-target-flag">
          <img
            id="onlineTargetFlag"
            src="../turkish-flag.png"
            alt="Turkish"
          />
        </div>


        <button
          class="search-submit-button"
          type="submit"
        >
          Search
        </button>

      </form>


      <div
        id="onlineResult"
        class="result-area"
        hidden
      ></div>

    </section>


    <!-- SEARCH WIKTIONARY -->

    <section class="search-card">

      <div class="card-title-area">

        <div class="card-heading">

          <img
            src="../wiktionary.png"
            alt="Wiktionary"
            class="service-logo wiktionary-logo"
          />

          <h2>
            Search on Wiktionary
          </h2>

        </div>

        <div
          id="wiktionaryDirection"
          class="search-direction"
        >
          Turkish → English
        </div>

      </div>


      <form
        id="wiktionarySearchForm"
        class="search-form"
      >

        <div class="search-language-flag">
          <img
            id="wiktionarySourceFlag"
            src="../turkish-flag.png"
            alt="Turkish"
          />
        </div>


        <div class="search-field-wrap">

          <svg
            class="field-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15a7.5 7.5 0 0 1 0 15Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="wiktionarySearchInput"
            type="text"
            autocomplete="off"
            placeholder="Type a Turkish word..."
          />

        </div>


        <button
          class="search-submit-button"
          type="submit"
        >
          Search
        </button>

      </form>


      <div
        id="wiktionaryResult"
        class="result-area"
        hidden
      ></div>

    </section>


    <!-- SEARCH CACHE -->

    <section class="search-card">

      <div class="card-title-area">

        <div class="card-heading">

          <img
            src="../library.png"
            alt=""
            class="service-logo library-card-logo"
          />

          <h2>
            Search in cache
          </h2>

        </div>


        <div class="cache-description">
          Search words already saved in your library
        </div>


        <div class="cache-language-switch">

          <button
            id="cacheTargetButton"
            class="cache-language-button active"
            type="button"
          >
            Turkish
          </button>

          <button
            id="cacheEnglishButton"
            class="cache-language-button"
            type="button"
          >
            English
          </button>

        </div>

      </div>


      <form
        id="cacheSearchForm"
        class="search-form cache-search-form"
      >

        <div class="search-language-flag">

          <img
            id="cacheSearchFlag"
            src="../turkish-flag.png"
            alt="Turkish"
          />

        </div>


        <div class="search-field-wrap">

          <svg
            class="field-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15a7.5 7.5 0 0 1 0 15Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="cacheSearchInput"
            type="text"
            autocomplete="off"
            placeholder="Search Turkish words..."
          />

        </div>

      </form>


      <div
        id="cacheSuggestions"
        class="cache-results"
        hidden
      ></div>

    </section>

  </main>


  <script
    type="module"
    src="./js/dictionary.js"
  ></script>

</body>
</html>
